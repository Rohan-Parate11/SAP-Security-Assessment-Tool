<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAP Security Assessment Tool</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header class="shellbar">
    <div class="shellbar-left">
      <button class="shellbar-menu-btn" id="sidenavToggleBtn" aria-label="Toggle navigation" title="Toggle navigation">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
      </button>
      <div class="shellbar-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 1 2 5v6c0 5.5 3.8 10.7 10 12 6.2-1.3 10-6.5 10-12V5l-10-4Zm0 2.2 8 3.2v4.6c0 4.5-3 8.8-8 9.9-5-1.1-8-5.4-8-9.9V6.4l8-3.2Z"/><path fill="currentColor" d="m10.9 14.9-2.4-2.4-1.4 1.4 3.8 3.8 6.6-6.6-1.4-1.4z"/></svg>
      </div>
      <span class="shellbar-title">SAP Security Assessment Tool</span>
      <nav class="breadcrumb" id="breadcrumb"></nav>
    </div>
    <div class="shellbar-right">
      <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-7.54-7.54A9 9 0 0 0 12 3Z"/></svg>
      </button>
      <div class="avatar" title="Consultant">SC</div>
    </div>
  </header>

  <div class="run-banner" id="runBanner" hidden>
    <span class="spinner" id="runBannerSpinner"></span>
    <span class="run-banner-text" id="runBannerText"></span>
    <div class="run-banner-track"><div class="run-banner-fill" id="runBannerFill"></div></div>
    <span class="run-banner-pct" id="runBannerPct"></span>
    <button class="run-banner-dismiss" id="runBannerDismiss" hidden aria-label="Dismiss">&times;</button>
  </div>

  <div class="layout">
    <nav class="sidenav" id="sidenav"></nav>
    <main id="app"></main>
  </div>

  <!-- Add System modal -->
  <div class="modal-backdrop" id="addSystemBackdrop" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2 id="systemModalTitle">Add System</h2>
        <button class="icon-btn" data-close="addSystemBackdrop" aria-label="Close">&times;</button>
      </div>
      <form id="addSystemForm" class="modal-body">
        <div class="field-row">
          <label>Label <span class="req">*</span><input name="label" placeholder="e.g. Customer ABC - Production" required></label>
        </div>
        <div class="field-row">
          <label>Environment <span class="req">*</span>
            <select name="environment" required>
              <option value="" disabled selected>Select environment...</option>
              <option value="Sandbox">Sandbox</option>
              <option value="Development">Development</option>
              <option value="Quality">Quality</option>
              <option value="Production">Production</option>
            </select>
          </label>
        </div>
        <div class="field-row two-col">
          <label>System ID (SID) <span class="req">*</span><input name="system_id" placeholder="S23" required></label>
          <label>Client <span class="req">*</span><input name="client" placeholder="100" required></label>
        </div>
        <div class="field-row two-col">
          <label>Application Server Host <span class="req">*</span><input name="ashost" placeholder="10.40.10.132" required></label>
          <label>System Number <span class="req">*</span><input name="sysnr" placeholder="00" required></label>
        </div>
        <div class="field-row two-col">
          <label>RFC User <span class="req">*</span><input name="user" placeholder="SSAT_RFC" required></label>
          <label>Language<input name="lang" placeholder="EN" value="EN"></label>
        </div>
        <div class="field-row two-col detect-gateway-row">
          <input type="password" id="testConnPassword" placeholder="RFC password (for test only, not saved)" autocomplete="off">
          <button type="button" class="btn btn-ghost" id="testConnBtn">Test Connection</button>
        </div>
        <p class="hint" id="testConnHint"></p>
        <fieldset class="odata-fieldset">
          <legend>
            <label class="checkbox-label"><input type="checkbox" id="odataToggle"> OData / Gateway (for FIO-007)</label>
          </legend>
          <div id="odataFields" hidden>
            <div class="field-row">
              <label>Gateway Base URL<input name="odata_base_url" placeholder="https://10.40.10.132:44300"></label>
            </div>
            <div class="field-row two-col">
              <label>Client<input name="odata_client" placeholder="same as above"></label>
              <label class="checkbox-label" style="align-self:end;"><input type="checkbox" name="odata_verify_ssl"> Verify TLS certificate</label>
            </div>
            <div class="field-row two-col detect-gateway-row">
              <input type="password" id="detectGatewayPassword" placeholder="RFC password (for detection only, not saved)" autocomplete="off">
              <button type="button" class="btn btn-ghost" id="detectGatewayBtn">Detect from System</button>
            </div>
            <p class="hint" id="detectGatewayHint"></p>
          </div>
        </fieldset>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close="addSystemBackdrop">Cancel</button>
          <button type="submit" class="btn btn-primary">Save System</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Run assessment modal -->
  <div class="modal-backdrop" id="runBackdrop" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>Run Assessment</h2>
        <button class="icon-btn" data-close="runBackdrop" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <p class="run-target" id="runTargetLabel"></p>
        <form id="runForm">
          <div class="field-row">
            <label>RFC Password <span class="req">*</span><input type="password" name="password" autocomplete="off" required></label>
          </div>
          <p class="hint">Not stored -- used only for this run, held in memory for its duration.</p>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close="runBackdrop">Cancel</button>
            <button type="submit" class="btn btn-primary">Run</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Risk indicator detail popup (opened by clicking a Top Risk Indicators card) -->
  <div class="modal-backdrop" id="riskDetailBackdrop" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2 id="riskDetailTitle">Finding</h2>
        <button class="icon-btn" data-close="riskDetailBackdrop" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <dl class="risk-detail-dl" id="riskDetailBody"></dl>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
